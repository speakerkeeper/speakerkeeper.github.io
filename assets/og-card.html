<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Speaker Keeper share card</title>
<!--
  Source for assets/og.png, the image that unfurls when the site is linked.
  Regenerate after changing it:

    python -m http.server 8000
    chrome --headless=new --disable-gpu --hide-scrollbars \
           --window-size=1200,630 \
           --screenshot=assets/og.png http://localhost:8000/assets/og-card.html

  1x on purpose: a 2x render is sharper but three times the weight, and some
  chat apps quietly skip a preview image over a few hundred kilobytes.

  1200x630 is the size every platform crops from. Everything sits well inside
  the middle, because Slack, iMessage and WhatsApp each trim a different edge.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }

  body {
    width: 1200px;
    height: 630px;
    display: grid;
    place-items: center;
    background: #0b0e14;
    font-family: Inter, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* The accent, spent once: a wash of Bluetooth blue behind the mark. */
  .glow {
    position: absolute;
    top: 50%; left: 50%;
    width: 900px; height: 900px;
    transform: translate(-50%, -62%);
    background: radial-gradient(circle, rgba(15, 113, 250, .26) 0%, rgba(15, 113, 250, 0) 62%);
  }

  .card { position: relative; text-align: center; }

  img { width: 168px; height: 168px; border-radius: 38px; display: block; margin: 0 auto 34px; }

  h1 {
    font-size: 78px;
    font-weight: 700;
    letter-spacing: -0.035em;
    line-height: 1;
    color: #f1f4f9;
  }

  p {
    margin-top: 22px;
    font-size: 34px;
    font-weight: 500;
    letter-spacing: -0.015em;
    color: #98a3b5;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="card">
    <img src="logo-256.png" alt="">
    <h1>Speaker Keeper</h1>
    <p>Keeps your Bluetooth speaker awake</p>
  </div>
</body>
</html>
